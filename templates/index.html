<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小伴 — 陪伴式学习机器人</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f5; height: 100vh; display: flex; }

/* 左侧：对话区 */
.chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; }
.chat-header { padding: 16px 20px; border-bottom: 1px solid #eee; font-size: 18px; font-weight: 600; }
.chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
.msg { margin-bottom: 16px; max-width: 80%; }
.msg.user { margin-left: auto; }
.msg .bubble { padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 15px; }
.msg.user .bubble { background: #007aff; color: #fff; border-bottom-right-radius: 4px; }
.msg.bot .bubble { background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
.msg .label { font-size: 12px; color: #999; margin-bottom: 4px; }
.msg.user .label { text-align: right; }
.chat-input { display: flex; padding: 12px 20px; border-top: 1px solid #eee; gap: 8px; }
.chat-input input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
.chat-input input:focus { border-color: #007aff; }
.chat-input button { padding: 10px 20px; background: #007aff; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
.chat-input button:hover { background: #0056cc; }
.chat-input button:disabled { background: #ccc; cursor: not-allowed; }

/* 右侧：Agent 调试面板 */
.debug-panel { width: 360px; background: #1e1e2e; color: #cdd6f4; overflow-y: auto; font-family: "SF Mono", monospace; font-size: 13px; }
.debug-header { padding: 12px 16px; border-bottom: 1px solid #313244; font-size: 14px; font-weight: 600; color: #89b4fa; }
.debug-section { padding: 12px 16px; border-bottom: 1px solid #313244; }
.debug-section h3 { font-size: 12px; color: #89b4fa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
.debug-section pre { white-space: pre-wrap; word-break: break-all; color: #a6e3a1; font-size: 12px; line-height: 1.5; }
.debug-section .status { color: #f9e2af; }
.debug-section .error { color: #f38ba8; }
.debug-empty { padding: 40px 16px; text-align: center; color: #585b70; }

@media (max-width: 768px) { .debug-panel { display: none; } }
</style>
</head>
<body>

<div class="chat-panel">
  <div class="chat-header">小伴 — 陪伴式学习机器人</div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <input id="input" placeholder="对小伴说点什么..." autofocus>
    <button id="send" onclick="sendMessage()">发送</button>
  </div>
</div>

<div class="debug-panel">
  <div class="debug-header">Agent 链路调试</div>
  <div id="debug-content">
    <div class="debug-empty">发送消息后，这里会显示<br>文心 API 调用链路</div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const debugEl = document.getElementById('debug-content');
const history = [];

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) sendMessage(); });

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  appendMsg('user', text);
  history.push({ role: 'user', content: text });

  updateDebug('pending', '调用文心 API 中...', null, null);

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, user_id: 'default', history: history.slice(-10) }),
    });
    const data = await resp.json();

    appendMsg('bot', data.reply);
    history.push({ role: 'assistant', content: data.reply });

    updateDebug('done', null, data.intent, data.plan);
  } catch (e) {
    appendMsg('bot', '抱歉，出了点问题：' + e.message);
    updateDebug('error', e.message, null, null);
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

function appendMsg(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="label">${role === 'user' ? '你' : '小伴'}</div><div class="bubble">${escHtml(content)}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function updateDebug(status, msg, intent, plan) {
  if (status === 'pending') {
    debugEl.innerHTML = `<div class="debug-section"><h3>状态</h3><pre class="status">${msg}</pre></div>`;
    return;
  }
  if (status === 'error') {
    debugEl.innerHTML = `<div class="debug-section"><h3>错误</h3><pre class="error">${msg}</pre></div>`;
    return;
  }
  let html = '';
  if (intent) {
    html += `<div class="debug-section"><h3>调用点 1：意图识别</h3><pre>${JSON.stringify(intent, null, 2)}</pre></div>`;
  }
  if (plan) {
    html += `<div class="debug-section"><h3>调用点 2：任务规划</h3><pre>${JSON.stringify(plan, null, 2)}</pre></div>`;
  }
  html += `<div class="debug-section"><h3>调用点 3：对话生成</h3><pre class="status">完成 ✓</pre></div>`;
  debugEl.innerHTML = html;
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
